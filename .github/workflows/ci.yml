name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # 本项目开发机为 Windows, SQLite/路径行为有平台差异
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check aicp tests
      - name: Test (覆盖率门禁 75%, 行动项 #8)
        run: pytest --cov=aicp --cov-report=term-missing --cov-fail-under=75
